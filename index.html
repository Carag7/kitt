<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K.I.T.T. x Tesla Model Y (2026) Terminal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Visuelle Darstellung des Tesla Model Y (2026) mit integriertem K.I.T.T.-Lauflicht im Frontlicht -->
    <div class="tesla-car-container">
        <div class="tesla-badge">TESLA MODEL Y // 2026 ARCHITEKTUR</div>
        
        <!-- Grafische Frontansicht des Autos -->
        <div class="car-graphic">
            <div class="side-mirror left"></div>
            <div class="car-body">
                <div class="windshield"></div>
                <!-- Das Vorderlicht als K.I.T.T. Scanner -->
                <div class="headlights-bar">
                    <div class="scanner-container">
                        <div class="scanner-light"></div>
                    </div>
                </div>
                <div class="tesla-logo">T</div>
            </div>
            <div class="side-mirror right"></div>
        </div>
    </div>

    <!-- Header / Voice Modulator Display -->
    <header>
        <h1>K.I.T.T. // CYBERNETIC INTERFACE</h1>
        <div class="voice-modulator">
            <div class="v-bar"></div>
            <div class="v-bar"></div>
            <div class="v-bar"></div>
        </div>
    </header>

    <!-- Chat Container -->
    <div id="chat-container">
        <div class="message kitt-msg">
            System online. Hallo Michael. Ich bin direkt in die Frontsensorik des Tesla Model Y (2026) eingespeist. Alle Autopilot- und Diagnosemodule sind aktiv. Wie lautet unsere Direktive?
        </div>
    </div>

    <!-- API Settings Bar -->
    <div class="settings-bar">
        <label for="provider-select">KI-Engine:</label>
        <select id="provider-select" onchange="toggleApiKeyInput()">
            <option value="simulated">Lokaler K.I.T.T. Simulator (Kostenlos)</option>
            <option value="gemini">Google Gemini API</option>
            <option value="mistral">Mistral AI API (EU / DSGVO)</option>
            <option value="openai">OpenAI ChatGPT API</option>
        </select>
        <input type="password" id="api-key-input" placeholder="API Key eingeben..." style="display:none;">
    </div>

    <!-- Controls / Input Area -->
    <div class="input-area">
        <input type="text" id="user-input" placeholder="Nachricht an K.I.T.T. eingeben..." autofocus>
        <button onclick="sendMessage()">SENDEN</button>
        <button id="voice-btn" class="voice-btn" onclick="toggleVoiceInput()" title="Spracheingabe aktivieren">🎙️</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
